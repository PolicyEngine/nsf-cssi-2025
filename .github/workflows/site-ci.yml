name: Site CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Install Node dependencies
        working-directory: ./site
        run: bun install --frozen-lockfile

      - name: Sync content from docs to site
        run: python3 scripts/assemble_cssi_application.py
        continue-on-error: true

      - name: Lint
        working-directory: ./site
        run: bun run lint

      - name: Build
        working-directory: ./site
        run: bun run build
